<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e3ddcf" />
    <title>IT112 Week 7 Server-Side Development Starter Lab</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="main-content">
        <header class="topbar">
          <span>IT112 Week 7 Server-Side Development Starter Lab</span>
          <span class="record-count" aria-label="User count">
            <strong id="userCount">--</strong>
            <span class="count-label">users</span>
          </span>
        </header>

        <div id="messageRegion" class="message-region" aria-live="polite"></div>

        <div class="workspace-grid">
          <section class="entry-panel" aria-labelledby="formTitle">
            <div class="section-topline">
              <span class="section-number">01 / ENTRY</span>
            </div>
            <h2 id="formTitle">Add User</h2>

            <form id="contactForm">
              <label class="field-label" for="name">Name</label>
              <input class="form-control" id="name" name="name" autocomplete="name" placeholder="Full name" required />

              <label class="field-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />

              <label class="field-label" for="age">Age <span>OPTIONAL</span></label>
              <input class="form-control" id="age" name="age" type="number" min="1" placeholder="Age" />

              <div class="form-actions">
                <button class="btn btn-submit" id="saveButton" type="submit">Save User <span aria-hidden="true">&#8594;</span></button>
                <button class="btn btn-cancel" id="cancelEdit" type="button" hidden>Cancel</button>
              </div>
            </form>
          </section>

          <section class="directory-panel" id="directory" aria-labelledby="directoryTitle">
            <div class="directory-heading">
              <div>
                <p class="section-number">02 / DIRECTORY</p>
                <h2 id="directoryTitle">User List</h2>
              </div>
              <button class="btn btn-refresh" id="refreshButton" type="button" aria-label="Refresh user list" title="Refresh list">&#8635;</button>
            </div>

            <div class="directory-tools">
              <label class="visually-hidden" for="searchInput">Search users</label>
              <input id="searchInput" class="search-input" type="search" placeholder="Search by name or email" />
            </div>

            <div class="table-scroll">
              <table class="contact-table">
                <thead>
                  <tr><th scope="col">NAME</th><th scope="col">EMAIL</th><th scope="col">AGE</th><th scope="col" aria-label="Actions"></th></tr>
                </thead>
                <tbody id="contactRows">
                  <tr><td class="table-state" colspan="4">Loading users...</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>

      </main>
    </div>
    <script src="/js/app.js" defer></script>
  </body>
</html>
